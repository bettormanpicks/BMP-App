name: NHL Daily Update

on:
  schedule:
    # Runs every day at 3:00 AM Central Time
    - cron: '0 9 * * *' # UTC is 6 hours ahead of CT
  workflow_dispatch:  # allows manual trigger

jobs:
  nhl_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # required for pushing commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run getnhlgamelogs.py
        run: |
          python -u nhl/getnhlgamelogs.py

      - name: Run getnhlboxscores.py
        run: |
          python -u nhl/getnhlboxscores.py

      - name: Commit and Push Updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=3
          RETRY_DELAY=5  # seconds

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push updates..."

            # Make sure local branch matches remote main
            git fetch origin main
            git reset --hard origin/main

            # Stage the updated CSVs
            git add nhl/data/nhlplayergamelogs.csv nhl/data/nhlteamgames.csv

            # Commit only if changes exist
            if ! git diff --cached --quiet; then
              git commit -m "Automated NHL update: $(date +'%Y-%m-%d')"
            fi

            # Push changes
            if git push origin main; then
              echo "Push succeeded!"
              break
            else
              echo "Push failed, retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts."
              exit 1
            fi
          done
