name: Update NHL Injuries

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:

# --- Prevent overlapping runs ---
concurrency:
  group: nhl-injuries
  cancel-in-progress: false

jobs:
  scrape_injuries:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout repo ---
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0   # IMPORTANT for rebase

      # --- Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Install Chrome (needed for Selenium) ---
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # --- Install Python dependencies ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager unidecode pytz lxml

      # --- Run NHL injury scraper ---
      - name: Run NHL injury scraper
        run: |
          python -u nhl/nhlinjuries.py

      # --- Commit & Push Updated CSV ---
      - name: Commit & Push Updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add nhl/data/nhlplayerstatus.csv

          # Only commit if changes exist
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL injuries CSV [skip ci]"

            # Pull latest remote changes and rebase
            git pull --rebase origin main

            # Push explicitly to main
            git push origin main
          else
            echo "No changes to commit."
          fi
