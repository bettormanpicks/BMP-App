name: Update NHL Injuries

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:

# --- Prevent overlapping runs ---
concurrency:
  group: nhl-injuries
  cancel-in-progress: false

jobs:
  scrape_injuries:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout repo ---
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0   # IMPORTANT for rebase

      # --- Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Install Chrome (needed for Selenium) ---
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # --- Install Python dependencies ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager unidecode pytz lxml

      # --- Run NHL injury scraper ---
      - name: Run NHL injury scraper
        run: |
          python -u nhl/nhlinjuries.py

      # --- Commit & Push Updated CSV ---
      - name: Commit & Push Updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=3
          RETRY_DELAY=5  # seconds

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push changes..."

            # Reset local branch to latest remote main
            git fetch origin main
            git reset --hard origin/main

            # Stage updated CSV
            git add nhl/data/nhlplayerstatus.csv

            # Only commit if changes exist
            if ! git diff --cached --quiet; then
              git commit -m "Update NHL injuries CSV [skip ci]"
            fi

            # Try push
            if git push origin main; then
              echo "Push succeeded!"
              break
            else
              echo "Push failed, retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts."
              exit 1
            fi
          done
