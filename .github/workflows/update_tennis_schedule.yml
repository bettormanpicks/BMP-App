name: Update Tennis Schedule

on:
  schedule:
    - cron: "0 */3 * * *"   # every 180 minutes UTC
  workflow_dispatch:

concurrency:
  group: tennis-schedule
  cancel-in-progress: false

jobs:
  scrape_schedule:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Chrome (for Selenium)
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager unidecode pytz lxml beautifulsoup4

      # STEP 1 — scrape schedule
      - name: Run tennis schedule scraper
        run: |
          python -u tennis/gettennisschedule.py

      # STEP 2 — resolve player names
      - name: Resolve tennis players
        run: |
          python -u tennis/resolve_tennis_player.py

      # STEP 3 — commit updated CSVs
      - name: Commit & Push Updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=3
          RETRY_DELAY=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push changes..."

            git fetch origin main
            git reset --hard origin/main

            git add tennis/data/tennis_schedule.csv
            git add tennis/data/tennis_schedule_resolved.csv

            if ! git diff --cached --quiet; then
              git commit -m "Update tennis schedule [skip ci]"
            fi

            if git push origin main; then
              echo "Push succeeded!"
              break
            else
              echo "Push failed, retrying..."
              sleep $RETRY_DELAY
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after retries"
              exit 1
            fi
          done
