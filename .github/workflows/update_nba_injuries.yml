name: Update NBA Injuries

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:

jobs:
  scrape_injuries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager unidecode pytz

      - name: Run NBA injury scraper
        run: |
          python nba/nbainjuries.py

      - name: Commit & Push Updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=3
          RETRY_DELAY=5  # seconds

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push changes..."

            # Ensure we start from the latest remote main
            git fetch origin main
            git reset --hard origin/main

            # Stage updated CSV
            git add nba/data/nbaplayerstatus.csv

            # Commit only if there are changes
            git diff --cached --quiet || git commit -m "Update NBA injuries CSV [skip ci]"

            # Try pushing
            if git push origin main; then
              echo "Push succeeded!"
              break
            else
              echo "Push failed, retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts."
              exit 1
            fi
          done
